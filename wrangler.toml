name = "ness-site2026"
main = "./workers/app.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# O diretório dos assets é preenchido pelo plugin do Vite no build, apontando
# para a saída do cliente. Requisição que casa com um arquivo é servida pelo
# runtime antes de o Worker rodar; o resto vira HTML renderizado na edge.

# Os domínios de produção continuam no Cloudflare Pages até a virada, que é
# manual: apontar ness.com.br, trustness.com.br e forense.io para este Worker
# como Custom Domains. Sem `routes` aqui, `wrangler deploy` publica só em
# workers.dev e não toca produção.

[vars]
ENVIRONMENT = "production"
CANAL_WORKER_URL = "https://canal.ness.com.br"
CLOUDFLARE_ACCOUNT_ID = ""
CLOUDFLARE_AI_GATEWAY_ID = "ness-gateway"

[[kv_namespaces]]
binding = "CANAL_KV"
id = "b28950f237884a4aa47d103723dd09bf"

[[d1_databases]]
binding = "DB"
database_name = "canal-db"
database_id = "bd79ce1a-6fd0-49ef-8d9f-40ea53717e0e"

[[vectorize]]
binding = "VECTORIZE"
index_name = "canal-vectors"

[ai]
binding = "AI"
