name = "ness-site2026"
main = "./workers/app.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# O diretório dos assets é preenchido pelo plugin do Vite no build, apontando
# para a saída do cliente. Requisição que casa com um arquivo é servida pelo
# runtime antes de o Worker rodar; o resto vira HTML renderizado na edge.

# Virada do Pages para o Worker por rota, não por Custom Domain: o DNS segue
# apontando para o Pages e o Worker passa na frente. Custom Domain exigiria
# apagar o CNAME antes — a Cloudflare recusa criar um sobre CNAME existente —
# o que abriria uma janela com o domínio sem destino. Com rota não há janela,
# e o rollback é remover estas linhas e reimplantar.
#
# Virado em 08/09/2026, um domínio por vez, validando entre um e outro.
# Estas rotas precisam viver aqui: o deploy trata este arquivo como fonte da
# verdade e sobrescreve o que existir no painel.

[[routes]]
pattern = "forense.io/*"
zone_name = "forense.io"

[[routes]]
pattern = "trustness.com.br/*"
zone_name = "trustness.com.br"

[[routes]]
pattern = "ness.com.br/*"
zone_name = "ness.com.br"

[vars]
ENVIRONMENT = "production"
CANAL_WORKER_URL = "https://canal.ness.com.br"
CLOUDFLARE_ACCOUNT_ID = ""
CLOUDFLARE_AI_GATEWAY_ID = "ness-gateway"

[[kv_namespaces]]
binding = "CANAL_KV"
id = "b28950f237884a4aa47d103723dd09bf"

[[d1_databases]]
binding = "DB"
database_name = "canal-db"
database_id = "bd79ce1a-6fd0-49ef-8d9f-40ea53717e0e"

[[vectorize]]
binding = "VECTORIZE"
index_name = "canal-vectors"

[ai]
binding = "AI"
