name: Deploy Cloudflare Stack

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Deploy ness-site2026 (Cloudflare Workers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Main Site
        run: npm run build
        env:
          # Chave pública, resolvida no build. Ausente, o widget não
          # renderiza e o site funciona igual.
          VITE_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}

      # O build gera dist/server/wrangler.json — a configuração com os
      # caminhos dos artefatos. Publicar com a wrangler.toml da raiz faria o
      # wrangler tentar empacotar o Worker de novo, sem o build do framework.
      - name: Deploy do Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c dist/server/wrangler.json

  deploy-backend:
    name: Deploy Canal CMS (Cloudflare Workers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Canal Dependencies
        working-directory: ./canal
        run: npm install

      - name: Build Canal Admin
        working-directory: ./canal/admin
        run: npm install && npm run build

      - name: Deploy Canal CMS (Backend + Admin Assets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'canal'
          command: deploy --minify
