name: Deploy Cloudflare Stack

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Deploy ness-site2026 (Cloudflare Pages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Root Dependencies
        run: npm install

      - name: Build Main Site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ness-site2026 --branch=main

  deploy-backend:
    name: Deploy Canal CMS (Cloudflare Workers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Canal Dependencies
        working-directory: ./canal
        run: npm install

      - name: Build Canal Admin
        working-directory: ./canal/admin
        run: npm install && npm run build

      - name: Deploy Canal CMS (Backend + Admin Assets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'canal'
          command: deploy --minify
