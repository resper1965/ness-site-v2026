name: Playwright Cloudflare Tests
on:
  push:
    branches: [ main, master ]
  # PRs são cobertos por preview.yml, que roda o mesmo smoke contra a URL
  # de preview real em vez de um build local — cobertura melhor, sem duplicar.
  # Acionamento manual via interface do Github
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # 1. Configurar Node
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    # 2. Instalar dependências gerais (Playwright e módulos)
    - name: Install dependencies
      run: npm ci || npm install --no-audit --no-fund
      
    # 3. Instalar os navegadores do Playwright
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    # 4. Site público: build local + smoke (metadados, overlays, chat, 404, orçamento)
    - name: Build site
      run: npm run build

    - name: Run site smoke tests (local preview)
      run: npm run test:e2e:site

    # 5. Canal (produção) — apenas sob demanda, para não bater em produção a cada PR
    - name: Run canal tests (production)
      if: github.event_name == 'workflow_dispatch'
      run: npm run test:e2e:canal

    # 6. Salvar relatórios em caso de falha UI (Traces, Vídeos)
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
