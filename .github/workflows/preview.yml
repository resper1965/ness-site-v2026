name: Preview por PR

# Publica cada PR num Worker próprio (ness-site2026-pr-N) e roda smoke e2e
# + Lighthouse contra ele. Produção não é tocada: é outro Worker, sem
# domínio, e ele é apagado quando o PR fecha.

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, closed ]

# Necessário para comentar a URL do preview no PR.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Publicar preview e validar
    runs-on: ubuntu-latest
    # PRs vindos de fork não recebem secrets — o job falharia no deploy.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Os testes de integridade (alegação sem fonte, codinome, marca) só
      # barram alguma coisa se rodarem aqui; antes, dependiam de alguém rodar
      # npm test na mão.
      - name: Testes unitários
        run: npm test

      # Versão fixa: uma versão nova do detector com regra nova não pode
      # derrubar a CI sem ninguém ter mexido no código. As exceções ficam em
      # .impeccable/config.json.
      - name: Detector do impeccable
        run: npx --yes impeccable@4.1.0 detect src

      - name: Build
        run: npm run build
        env:
          # Chave pública, resolvida no build. Ausente, o widget não
          # renderiza e o site funciona igual.
          VITE_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}

      # A wrangler.toml declara as rotas dos domínios de produção, e o wrangler
      # as aplica mesmo com --name. Sem esta limpeza, o Worker do PR
      # reivindicaria ness.com.br, trustness.com.br e forense.io para si —
      # uma rota só pode apontar para um Worker.
      - name: Tirar as rotas de produção da config do preview
        run: |
          node -e "
            const fs = require('fs');
            const f = 'dist/server/wrangler.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            delete c.routes; delete c.route;
            fs.writeFileSync(f, JSON.stringify(c));
          "
          grep -q '"routes"' dist/server/wrangler.json && { echo '::error::rotas ainda presentes na config do preview'; exit 1; } || true

      - name: Publicar preview num Worker do PR
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c dist/server/wrangler.json --name ness-site2026-pr-${{ github.event.pull_request.number }}

      # Sem esta trava, uma URL vazia faria o Playwright cair no fallback
      # de localhost do playwright.site.config.ts — CI verde testando o
      # build local em vez do preview.
      - name: Exigir URL de preview
        run: |
          if [ -z "${{ steps.deploy.outputs.deployment-url }}" ]; then
            echo "::error::O deploy não devolveu deployment-url. Abortando para não testar localhost por engano."
            exit 1
          fi
          echo "Preview: ${{ steps.deploy.outputs.deployment-url }}"

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke e2e contra o preview
        run: npm run test:e2e:site
        env:
          SITE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}

      - name: Lighthouse contra o preview
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.deploy.outputs.deployment-url }}
            ${{ steps.deploy.outputs.deployment-url }}/forense
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comentar a URL do preview no PR
        uses: actions/github-script@v7
        if: always()
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            if (!url) return;
            const marker = '<!-- preview-url -->';
            const body = `${marker}\n🔍 **Preview deste PR:** ${url}\n\nSmoke e2e e Lighthouse rodaram contra esta URL. Produção não foi tocada.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Guardar relatório do Playwright
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  limpar:
    name: Apagar o Worker do PR
    runs-on: ubuntu-latest
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      # Sem isto cada PR deixaria um Worker para trás na conta.
      - name: Apagar
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: delete --name ness-site2026-pr-${{ github.event.pull_request.number }} --force
